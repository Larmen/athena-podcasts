name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Enabled once the Gradle project exists (task T0.3).
    if: hashFiles('gradlew') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

  # Instrumented tests on Android 17 (API 37) emulator only (NFR-001); wire up after Phase 3.
